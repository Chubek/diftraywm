# Copy into ~/.config/diftraywm/diftray.yaml.
# Quote CSS colors: an unquoted # begins a YAML comment.
general:
  border_size: 3
  border_color: '#59a6ff'
  background_color: '#090c11'
  command_bar_height: 40
  status_bar_height: 24
  command_bar_color: '#141f2efa'
  ncursor_mode: stack
  gcursor_mode: tab
  font: monospace
  font_size: 14
  # Every key lives in this INI file, not here: keymap.ini holds the remapping,
  # the built-in bindings, the Meta prefix chord and the help pager keys. This
  # is the only key-related setting the config carries. Resolved relative to
  # this file. See help/keymap.1.
  keymap: keymap.ini
terminal:
  shell: libshell

# Use `output list` to find your connector name. Rotation is counter-clockwise.
monitors:
  - name: DP-1
    rotation: 90
    scale: 1.0
    # Omit x and y for automatic placement.
