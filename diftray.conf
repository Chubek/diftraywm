general {
  border_size = 3
  border_color = #59a6ff
  background_color = #090c11
  command_bar_height = 40
  status_bar_height = 24
  command_bar_color = #141f2efa
  ncursor_mode = stack
  gcursor_mode = tab
  font = monospace
  font_size = 14
  theme = themes/default.css
  word_pool = /usr/share/dict/words
  help_key_close = q
  help_key_search = /
  help_key_next = n
  help_key_previous = ?
  help_key_page_down = space
  help_key_page_up = b
  help_key_line_down = j
  help_key_line_up = k
}

terminal {
  shell = /bin/sh
}
