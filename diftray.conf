# DiftrayWM example configuration (PEGTL `.conf` DSL).
#
# Copy to ~/.config/diftraywm/diftray.conf (or select with
# DIFTRAYWM_CONFIG=/path/to/file). The same settings are accepted as TOML
# (`.toml`) and YAML (`.yaml`); see examples/diftray.toml,
# examples/diftray.yaml, and CONFIGURATION.md. Complete configuration-program
# examples are in examples/program.conf, examples/program.toml, and
# examples/program.yaml.
#
# Syntax: sections hold `key = value` lines. `#` starts a comment.
# Statements inside `program { ... }` end with semicolons.

# Optional configuration program. Uncomment to enable. It provides typed
# key bindings, variables, functions, and macros, plus $(...) substitution
# in the settings below. See CONFIGURATION.md.
# program {
#   let modifier = "Meta";
#   let physical = keycode(33);
#   let symbolic = keysym("F8");
#   let font_base = 7;
#   let portrait = true;
#   fn twice(n) = n * 2;
#   fn workspace(n) = "workspace " + str(n);
#   macro notebook(name) = commands("ncursor new", "notelet open " + name);
#   macro choose(condition, yes, no) = condition ? yes : no;
#   bind(modifier, physical, workspace(3));
#   bind(modifier, symbolic, notebook("scratchpad"), "global");
#   eval choose(true, twice(font_base), 1 / 0);
# }

general {
  # Positive integers (pixels).
  border_size = 3
  command_bar_height = 40
  status_bar_height = 24
  # Colors as #RRGGBB or #RRGGBBAA.
  border_color = #59a6ff
  background_color = #090c11
  command_bar_color = #141f2efa
  # Layout rule for extra views on one output/workspace: stack or tab.
  ncursor_mode = stack
  gcursor_mode = tab
  # Non-empty font family; integer >= 8.
  font = monospace
  font_size = 14
  # CSS theme file. Relative paths resolve against this file's directory.
  theme = themes/default.css
  # Word pool for GCursor IDs. Falls back to a built-in list when unreadable.
  word_pool = /usr/share/dict/words
  # Colon-separated help page search path. Empty (or commented out) uses
  # <config-dir>/help plus the installed help directory.
  # help_path = help
  # Help pager keys: space, pagedown/page-down, pageup/page-up, up, down are
  # matched by name (case-insensitive); otherwise a single character matches
  # the typed key.
  help_key_close = q
  help_key_search = /
  help_key_next = n
  help_key_previous = ?
  help_key_page_down = space
  help_key_page_up = b
  help_key_line_down = j
  help_key_line_up = k
}

terminal {
  # Default shell for new NTerm cells. "libshell" selects the built-in shell;
  # otherwise a path to an executable (e.g. /bin/bash).
  shell = libshell
}

# Per-monitor configuration. Up to 64 blocks; duplicate names are rejected.
# name is required (use "*" as the fallback for unmatched outputs).
# rotation is 0, 90, 180, or 270 (counter-clockwise).
# scale is 0.5 to 4. Omit x and y for automatic placement; otherwise both are
# required as integers from -100000 to 100000. Find names via `output list`.
# monitor {
#   name = DP-1
#   rotation = 90
#   scale = 1
#   x = 0
#   y = 0
# }
# monitor {
#   name = *
#   rotation = 0
#   scale = 1
# }
