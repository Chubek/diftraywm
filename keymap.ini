# DiftrayWM key remapping and key bindings.
#
# This file is the single source of truth for every key in DiftrayWM. The
# compositor's own configuration only names this file, with `keymap =
# keymap.ini` in its [general] section, and that path is resolved relative to
# the config file. Nothing about keys lives in diftray.conf.
#
# The format is the one keyd uses, so a keymap written for keyd reads the same
# way here:
#
#   [section]
#   chord = Action(argument)
#
# Read it with `keymap show` (or `diftrayctl keymap-show`), validate a change
# without adopting it with `keymap check <path>`, and apply it with `keymap
# reload`. An unknown section, chord or action is a hard error, not a silently
# ignored line, so a typo shows up as a message instead of a dead key.
#
# ---------------------------------------------------------------------------
# Chords
# ---------------------------------------------------------------------------
#   <C-q>     Ctrl+q          <M-q>   Meta (the Logo/Super key)
#   <A-q>     Alt+q           <S-q>   Shift+q
#   <G-q>     Logo/Super+q    <C-S-q> several modifiers may be combined
#   <f8>      F1..F12, written lower case
#   <space> <enter> <tab> <backspace> <esc> <del> <ins> <home> <end>
#   <up> <down> <left> <right> <pageup> <pagedown> <menu> <prtsc> <pause>
#   <grave> <minus> <equal> <leftbrace> <rightbrace> <backslash>
#   <semicolon> <apostrophe> <comma> <dot> <slash>
#   a-z, 0-9 and the punctuation keys may be written bare, or as the character
#   itself: `<;>` and `;` mean the same key.
#
# A chord always means the key plus exactly the modifiers written. <C-q> is
# Ctrl+q and not Ctrl+Shift+q or plain q.
#
# ---------------------------------------------------------------------------
# Actions
# ---------------------------------------------------------------------------
#   Diftray(command)   dispatch a Command Bar command. Everything you can type
#                     after `:` works here, which is what lets a profile drive
#                     the compositor without a new binary.
#   Exec(command)      run a program, detached, with WAYLAND_DISPLAY set.
#   Typeout(text)      type text into the focused cell's terminal.
#   Trigger(profile)   switch to another profile. The key is swallowed.
#   Remap(<chord>)     send a different chord downstream instead of this one.
#   Ignore()           swallow the key. Use it to disable a key entirely.
#
# ---------------------------------------------------------------------------
# Two prefixes, which are different things
# ---------------------------------------------------------------------------
# [init] prefix is the keyd-style remapping layer: pressing it on its own runs
# [init] action -- normally Trigger() into another profile -- and the keypress
# is swallowed, so the chord never reaches the terminal. It is a device-level
# idea, so diftrayremap honours it too.
#
# [meta] prefix is the compositor's Meta prefix: press it, then the next key
# behaves as if Meta were held. It is a session-level idea, and only the
# compositor has one.
#
# They are separate because they answer different questions, and sharing a chord
# between them would be ambiguous -- whichever ran first would swallow the key
# and the other would never see it. A keyboard whose Meta key you cannot reach
# wants [meta]; a chord you want to turn into something else wants [init].
#
# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# Every section other than [devices], [init], [meta] and [diftray] is a profile:
# a set of chord -> action bindings. `default` is active at startup.
#
# Bind a key in a non-default profile back to `default` to return to the normal
# keys; `keymap reset` and `diftrayctl keymap-reset` do the same from outside.
#
# ---------------------------------------------------------------------------
# Two backends, one file
# ---------------------------------------------------------------------------
# The compositor applies this file to the keys it already reads. That needs no
# privileges and affects only the DiftrayWM session.
#
# diftrayremap applies the same file system-wide. It takes the physical
# keyboard with EVIOCGRAB and republishes it through uinput, so the remapping
# reaches every consumer on the machine: the compositor, a TTY, another
# session, anything reading evdev. It needs access to /dev/input/event* and
# /dev/uinput, which normally means running it as root -- so it is a separate
# program, not a mode of the compositor. See help/keymap.1.
#
# Only evdev-level actions mean anything to diftrayremap. Ignore(), Remap() and
# Trigger() work at that layer; Diftray(), Exec() and Typeout() are compositor
# actions with no evdev equivalent, so those keys pass through untouched and the
# compositor's own copy of this file handles them.

[devices]
# The keyboards diftrayremap should intercept, as USB VENDOR:PRODUCT in
# hexadecimal. Leave this section out entirely to mean "every keyboard", which
# is the safe default: a machine that is only half remapped is a machine where
# the same chord does two different things depending on which board you typed
# on.
#
# `diftrayremap list` prints the identifiers of the keyboards it can see, so
# you do not have to guess these:
#
#   diftrayremap list keymap.ini
#
# mouse = 09da:3519
# keyboard = 320f:5080

[init]
# The remapping layer's chord. This is Ctrl+q as in the original example; it is
# kept on Ctrl+G here only so it cannot collide with [meta] below, which is the
# chord DiftrayWM has always used to reach Meta on a keyboard without a Logo
# key. Put it back on <C-q> once you have retargeted [meta] to something else.
prefix = <C-g>
action = Trigger(profile-1)

# Set this to true to ask for the system-wide backend as well. It is a request,
# not a switch: diftrayremap still has to be able to open /dev/uinput, and
# still has to be started deliberately, because taking the keyboard away from
# the whole system is not something a compositor should do on its own.
system_wide = false

[meta]
# Ctrl+Q, which is what the compositor has used by default: press and release
# it, then press the key you meant with Meta. `Escape` cancels an armed prefix.
#
# Comment this section out and the compositor falls back to a `prefix` variable
# in the configuration program, and then to Ctrl+Q, so removing this file cannot
# lock you out of your own session.
prefix = <C-q>

[diftray]
# The help pager's keys, moved here from the config file so that every key
# really is in one place. Each is a single character or one of: space,
# pagedown, pageup, up, down.
#
# The values below are the defaults, so this whole section can be deleted
# without changing behaviour.
help_key_close = q
help_key_search = /
help_key_next = n
help_key_previous = ?
help_key_page_down = space
help_key_page_up = b
help_key_line_down = j
help_key_line_up = k

[default]
# The compositor's built-in keys, written out so they can be read, changed or
# deleted. G is the Meta key, which is the Logo/Super key on a normal layout
# and the chord named by [init] prefix on a keyboard without one.
#
# Lines are commented out, because the C++ defaults already do exactly this and
# an uncommented duplicate would be a second place to keep in sync. Uncomment
# one to change it, or delete a block to hand those chords back to the
# terminal.

# Command bars.
# <G-semicolon> = Diftray(bar)          Meta+:  the NCursor global command bar
# <G-colon>     = Diftray(bar)
# <semicolon>   = Diftray(bar)          :      the cell command bar
# <G-d>         = Diftray(bar launch)   Meta+D the launcher

# Views and cells.
# <G-Tab>     = Diftray(view select)    enter and leave Cell Select Mode
# <G-Return>  = Diftray(cell tcursor)   promote the cell to a TCursor
# <G-n>       = Diftray(ncursor new)    another NCursor on this output
# <G-k>       = Diftray(kill)           kill the focused cell, with a prompt
# <G-Up>      = Diftray(cell move -1)   move the selected cell up
# <G-Down>    = Diftray(cell move 1)    move the selected cell down

# Workspaces and tabs.
# <G-1> .. <G-9> = Diftray(workspace N) switch to workspace N
# <G-0>         = Diftray(workspace 10)
# <G-Left>      = Diftray(tab prev)      previous tab
# <G-Right>     = Diftray(tab next)      next tab
# <G-leftbrace> = Diftray(output prev)   previous monitor
# <G-rightbrace> = Diftray(output next) next monitor

# Quick Restore.
# <G-f1> .. <G-f4> = Diftray(cursor restore N)

# The terminal multiplexer. Stacks split side by side, cells split vertically.
# <G-s> = Diftray(mux split h)          split the stack side by side
# <G-v> = Diftray(mux split v)          split the cell stack vertically
# <G-o> = Diftray(mux focus next)       next pane
# <G-p> = Diftray(mux focus prev)       previous pane
# <G-z> = Diftray(mux zoom)              zoom the focused pane
# <C-G-Up>    = Diftray(mux focus up)   directional focus, with Meta and Ctrl
# <C-G-Down>  = Diftray(mux focus down)
# <C-G-Left>  = Diftray(mux focus left)
# <C-G-Right> = Diftray(mux focus right)

[profile-1]
# Entered with the [init] chord, Ctrl+G. Two examples, both left in place
# because they are the clearest illustration of the two things a profile is for.
#
# Exec() runs a program. Here, a terminal multiplexer, on a chord no other
# application claims:
<C-f8> = Exec(kitty -m tmux)
#
# Typeout() types into the focused cell, which is how a chord turns into text
# at the prompt without a macro recorder:
<M-q> = Typeout(foobar)

# Leaving. Any chord bound to `default` returns to the normal keys. Escape
# would be the obvious choice, but it is already how a pending kill is
# cancelled, so use something free:
#
# <M-esc> = Trigger(default)
#
# The compositor offers `keymap reset` and `diftrayctl keymap-reset` for the
# same thing, so nothing is lost if you never bind a way out.
